schema_version: 1
workspace_root: ../..

# Scooby-Doo! Unmasked, North America (G5DE78), GameCube. main.dol only; function names come from the
# release ELF on the disc (files/engine_ret.elf, byte-identical sections), see projects/scooby/MAP.txt.
project:
  id: scooby-g5de78
  display_name: Scooby-Doo! Unmasked (USA)
  game_id: G5DE78
  region: E
  base_manifest_format: scooby-recomp-base-manifest
  base_manifest_stem: scooby_base

memory:
  base: 0x80000000
  size: 0x03000000  # MEM1 + the logic-module overlay at 0x81800000 (24 MiB)
  sda_base: 0x8027E0C0
  sda2_base: 0x80282020

inputs:
  dol:
    path: ../game/main_logic.dol  # main.dol + logic overlay + 2 patched loader calls (build_logic_overlay.py)
    sha256: 595285accfaaac6cab9b10c4a97f8dcbe4ca609e5ce99270bbe31b5fa69b0781

translation:
  entry_points:
    - 0x80011C1C
  function_map:
    path: projects/scooby/MAP_all.txt  # MAP.txt + MAP_logic.txt (written by the build)
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/scooby_base_manifest.json
